name: Bug report
description: Report a reproducible FastDOM Beta problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "This report is PUBLIC. Never include credentials, account information, databases, tokens, or unredacted screenshots. Send sensitive concerns privately to support@decoglobal.us."
  - type: input
    id: build
    attributes:
      label: FastDOM build ID
      description: Copy the build ID from your download or the app.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connection or mode
      options:
        - Simulation
        - Schwab
        - NinjaTrader
        - Alpaca paper
        - Alpaca live
        - Installation or startup
        - Other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the controls and actions without disclosing account details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and visible error
      description: Redact sensitive information before posting.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account details, and other sensitive information.
          required: true
